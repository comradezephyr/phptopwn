services:
  honeypot:
    build: .
    container_name: php2shell-honeypot
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      PHPTOPWN_HTTP_PORT: "8080"
      PHPTOPWN_TLS_PORT: "8443"
      PHPTOPWN_METRICS_PORT: "9091"
      PHPTOPWN_TLS: "true"
      PHPTOPWN_LOG_DIR: "/app/logs"
      PHPTOPWN_CAPTURE_DIR: "/app/captured_payloads"
      PHPTOPWN_LOG_ALL: "true"
      PHPTOPWN_TRUST_PROXY_HEADERS: "false"
      PHPTOPWN_MAX_BODY_BYTES: "33554432"
      PHPTOPWN_BODY_TIMEOUT_SECONDS: "30"
    volumes:
      - ./logs:/app/logs
      - ./captured_payloads:/app/captured_payloads
      - ./certs:/app/certs
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
