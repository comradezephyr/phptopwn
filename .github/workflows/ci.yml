name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tooling
        run: python -m pip install --upgrade pip && python -m pip install .[dev]

      - name: Lint (ruff)
        run: ruff check phptopwn tests

      - name: Type check (mypy)
        run: mypy phptopwn

      - name: Tests
        run: python -m coverage run --branch --source=phptopwn -m pytest

      - name: Coverage gate
        run: python -m coverage report --fail-under=85 -m
